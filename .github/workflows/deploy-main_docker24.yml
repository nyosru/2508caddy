name: Deploy to VPS

env:
  VPS_HOST: 91.218.230.97
  VPS_USERNAME: root
  DIR: /home2/2508caddy
  GIT_BRANCH: origin/main
  DOCKER_CONTAINER: caddy

on:
  push:
    branches: [main]

jobs:
  sms_start:
    runs-on: ubuntu-latest
    steps:
      - name: sms_vk_start
        run: |
          curl -X POST "https://api.php-cat.com/api/vk/send" \
            -H "Content-Type: application/json" \
            -d '{
              "group_name": "tech",
              "user_id": 5903492,
              "message": "🚀🚀🚀 ${{ github.repository }} Старт деплоя \n 💻 ${{ github.actor }} (${{ github.run_id }}) \n 📝 ${{ github.event.head_commit.message }} "
            }'

  deploy:
    runs-on: ubuntu-latest
    needs: [sms_start]
    steps:
      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy code to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY_DOCKER24 }}
          script: |
            set -e  # Выход при ошибке
            cd ${{ env.DIR }}
            git fetch --all
            git reset --hard ${{ env.GIT_BRANCH }}
            echo "✅ Код успешно обновлен"

            cp /home2/2508caddy/caddy/prod.Caddyfile /home2/2508caddy/caddy/Caddyfile
            cp docker-compose.prod.yml docker-compose.yml
            docker compose down --rmi all -v
            docker compose up -d --build
            echo "✅✅ контейнеры перезагружены"

            echo "🔄 Перезагружаем Caddy..."
            docker compose exec -T ${{ env.DOCKER_CONTAINER }} caddy reload --config /etc/caddy/Caddyfile
            echo "✅✅ Caddy перезагружен"

  sms_end:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: sms_vk
        run: |
          curl -X POST "https://api.php-cat.com/api/vk/send" \
            -H "Content-Type: application/json" \
            -d '{
              "group_name": "tech",
              "user_id": 5903492,
              "message": "🍀🍀🍀 ${{ github.repository }} Deployment finished \n ‍💻 ${{ github.ref_name }} ++ ${{ github.actor }} (${{ github.run_id }}) "
            }'
